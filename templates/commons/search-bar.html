<div class="search-bar">
  <form method="get" class="search-bar__form">
    <div class="search-bar__input-wrap">
      <svg class="search-bar__icon" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 20 20">
        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m19 19-4-4m0-7A7 7 0 1 1 1 8a7 7 0 0 1 14 0Z"/>
      </svg>

      <input
        type="search"
        id="id-search-input"
        name="q"
        value="{{ search_query }}"
        placeholder="{{ placeholder|default:'Pesquisar...' }}"
        class="search-bar__input"
        autocomplete="off"
        spellcheck="false"
      />

      <button type="submit" class="ui-btn ui-btn--primary ui-btn--sm search-bar__submit">
        Buscar
      </button>
    </div>

    {% if search_query %}
      <p class="ui-body-sm ui-text-mute search-bar__hint">
        Pesquisando por <span class="search-bar__hint-strong">"{{ search_query }}"</span>
      </p>
    {% endif %}
  </form>
</div>

<style>
  .search-bar { margin: 24px 0; }
  .search-bar__form { display: flex; flex-direction: column; gap: 8px; }
  .search-bar__input-wrap {
    position: relative;
    display: flex;
    align-items: center;
    background-color: var(--color-canvas-soft);
    border-radius: var(--rounded-pill);
    padding: 4px 4px 4px 16px;
    transition: background-color 140ms ease, box-shadow 140ms ease;
  }
  .search-bar__input-wrap:hover { background-color: var(--color-surface-pressed); }
  .search-bar__input-wrap:focus-within {
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }
  .search-bar__icon { flex-shrink: 0; color: var(--color-body); margin-right: 8px; }
  .search-bar__input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    padding: 12px 12px 12px 0;
    font-family: var(--font-text);
    font-weight: 400;
    font-size: 16px;
    line-height: 24px;
    color: var(--color-ink);
    min-width: 0;
  }
  .search-bar__input::placeholder { color: var(--color-mute); }
  .search-bar__submit { flex-shrink: 0; }
  .search-bar__hint { padding-left: 4px; }
  .search-bar__hint-strong { color: var(--color-ink); font-weight: 500; }

  @media (max-width: 480px) {
    .search-bar__input-wrap { padding: 4px; }
    .search-bar__icon { margin-left: 12px; }
    .search-bar__submit { padding: 8px 14px; }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var searchInput = document.getElementById('id-search-input');
    if (!searchInput) return;
    var searchForm = searchInput.closest('form');

    document.addEventListener('keydown', function (e) {
      if (e.key === '/' && !['INPUT', 'TEXTAREA'].includes(e.target.tagName)) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape' && e.target === searchInput) {
        searchInput.value = '';
        searchInput.blur();
      }
    });

    if (searchForm) {
      searchForm.addEventListener('submit', function () {
        var submitButton = searchForm.querySelector('button[type="submit"]');
        if (!submitButton) return;
        var originalText = submitButton.textContent;
        submitButton.disabled = true;
        submitButton.textContent = 'Buscando…';
        setTimeout(function () {
          submitButton.disabled = false;
          submitButton.textContent = originalText;
        }, 3000);
      });
    }

    searchInput.addEventListener('focus', function () { this.select(); });
  });
</script>
