{% comment %}
SITTS UI — base styles + design tokens.

Include once near the top of any standalone page:
    {% include 'ui/_styles.html' %}

Follows DESIGN.md (Uber-inspired black-and-white duet, pill geometry,
geometric display sans, sentence-case voice).
{% endcomment %}

<style>
  :root {
    /* === Colors — brand & accent === */
    --color-primary: #000000;
    --color-on-primary: #ffffff;
    --color-black-elevated: #282828;
    --color-surface-pressed: #e2e2e2;

    /* === Colors — text === */
    --color-ink: #000000;
    --color-body: #5e5e5e;
    --color-hairline-mid: #4b4b4b;
    --color-mute: #afafaf;
    --color-on-dark: #ffffff;

    /* === Colors — surface === */
    --color-canvas: #ffffff;
    --color-canvas-soft: #efefef;
    --color-canvas-softer: #f3f3f3;

    /* === Colors — semantic (limited; for toasts only) === */
    --color-link: #0000ee;
    --color-toast-success: #1f8a3b;
    --color-toast-error: #d92121;
    --color-toast-warning: #c98a00;
    --color-toast-info: #2a6ef5;

    /* === Typography === */
    --font-display: 'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
    --font-text:    'Inter', system-ui, 'Helvetica Neue', Arial, sans-serif;
    --font-mono:    'JetBrains Mono', ui-monospace, monospace;

    /* === Radius === */
    --rounded-none: 0px;
    --rounded-md: 8px;
    --rounded-lg: 12px;
    --rounded-xl: 16px;
    --rounded-pill: 999px;
    --rounded-pill-tab: 36px;
    --rounded-full: 9999px;

    /* === Spacing === */
    --space-xxs: 4px;
    --space-xs:  6px;
    --space-sm:  8px;
    --space-md:  12px;
    --space-lg:  16px;
    --space-xl:  20px;
    --space-2xl: 24px;
    --space-3xl: 32px;

    /* === Elevation === */
    --shadow-1: 0 4px 16px rgba(0, 0, 0, 0.12);
    --shadow-2: 0 4px 16px rgba(0, 0, 0, 0.16);
    --shadow-3: 0 2px 8px  rgba(0, 0, 0, 0.16);
  }

  *,
  *::before,
  *::after { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    font-family: var(--font-text);
    color: var(--color-ink);
    background-color: var(--color-canvas);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* === Skip link === */
  .ui-skip-link {
    position: fixed;
    /* Parked off-screen via `top` rather than `transform`: nothing else can
       compose with it, and it survives any ancestor stacking context. */
    top: -120px;
    left: 8px;
    z-index: 10000;
    padding: 10px 18px;
    border-radius: var(--rounded-pill);
    background-color: var(--color-primary);
    color: var(--color-on-primary);
    font-family: var(--font-text);
    font-size: 14px;
    font-weight: 500;
    line-height: 16px;
    text-decoration: none;
    transition: top 140ms ease;
  }
  .ui-skip-link:focus { top: 8px; outline: none; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.25); }

  /* === Typography utility classes === */
  .ui-display-xxl { font-family: var(--font-display); font-weight: 700; font-size: 52px; line-height: 64px; letter-spacing: 0; color: var(--color-ink); margin: 0; }
  .ui-display-xl  { font-family: var(--font-display); font-weight: 700; font-size: 36px; line-height: 44px; color: var(--color-ink); margin: 0; }
  .ui-display-lg  { font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 40px; color: var(--color-ink); margin: 0; }
  .ui-display-md  { font-family: var(--font-display); font-weight: 700; font-size: 24px; line-height: 32px; color: var(--color-ink); margin: 0; }
  .ui-display-sm  { font-family: var(--font-display); font-weight: 700; font-size: 20px; line-height: 28px; color: var(--color-ink); margin: 0; }

  .ui-body-lg          { font-family: var(--font-text); font-weight: 500; font-size: 18px; line-height: 24px; color: var(--color-ink); margin: 0; }
  .ui-body-md          { font-family: var(--font-text); font-weight: 400; font-size: 16px; line-height: 24px; color: var(--color-ink); margin: 0; }
  .ui-body-md-strong   { font-family: var(--font-text); font-weight: 500; font-size: 16px; line-height: 20px; color: var(--color-ink); margin: 0; }
  .ui-body-sm          { font-family: var(--font-text); font-weight: 400; font-size: 14px; line-height: 20px; color: var(--color-ink); margin: 0; }
  .ui-body-sm-strong   { font-family: var(--font-text); font-weight: 500; font-size: 14px; line-height: 16px; color: var(--color-ink); margin: 0; }
  .ui-caption          { font-family: var(--font-text); font-weight: 400; font-size: 12px; line-height: 20px; color: var(--color-body); margin: 0; }

  /* === Button === */
  .ui-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-sm);
    border: 1px solid transparent;
    cursor: pointer;
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 16px;
    line-height: 20px;
    padding: 12px 16px;
    border-radius: var(--rounded-pill);
    transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease, box-shadow 140ms ease, transform 60ms ease;
    text-decoration: none;
    white-space: nowrap;
    min-height: 44px;
  }
  .ui-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.18); }
  .ui-btn:active { transform: translateY(1px); }
  .ui-btn--full { width: 100%; }
  .ui-btn--lg { font-size: 18px; line-height: 24px; padding: 16px 20px; min-height: 56px; border-radius: var(--rounded-xl); }
  .ui-btn--sm { font-size: 14px; line-height: 16px; padding: 8px 16px; min-height: 36px; }

  .ui-btn--primary { background-color: var(--color-primary); color: var(--color-on-primary); }
  .ui-btn--primary:hover { background-color: var(--color-black-elevated); }
  .ui-btn--primary:active { background-color: var(--color-black-elevated); }
  .ui-btn--primary:disabled,
  .ui-btn--primary[aria-disabled="true"] {
    background-color: var(--color-canvas-soft);
    color: var(--color-mute);
    cursor: not-allowed;
  }

  .ui-btn--secondary {
    background-color: var(--color-canvas);
    color: var(--color-ink);
    border-color: var(--color-ink);
  }
  .ui-btn--secondary:hover { background-color: var(--color-canvas-soft); }
  .ui-btn--secondary:active { background-color: var(--color-surface-pressed); }

  .ui-btn--subtle {
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    padding: 12px 16px;
  }
  .ui-btn--subtle:hover { background-color: var(--color-surface-pressed); }

  .ui-btn--floating {
    background-color: var(--color-canvas);
    color: var(--color-ink);
    box-shadow: var(--shadow-3);
    padding: 12px;
  }
  .ui-btn--floating:hover { background-color: var(--color-canvas-soft); }

  .ui-btn--ghost {
    background-color: transparent;
    color: var(--color-ink);
  }
  .ui-btn--ghost:hover { background-color: var(--color-canvas-soft); }

  /* Destructive action — soft red surface. Reserve for confirmation modals
     (Excluir, Desconciliar, etc.), not row triggers. */
  .ui-btn--danger {
    background-color: rgba(217, 33, 33, 0.10);
    color: var(--color-toast-error);
  }
  .ui-btn--danger:hover { background-color: rgba(217, 33, 33, 0.16); }
  .ui-btn--danger:active { background-color: rgba(217, 33, 33, 0.20); }

  /* === Text link === */
  .ui-link {
    color: var(--color-ink);
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 16px;
    line-height: 24px;
    text-decoration: underline;
    text-underline-offset: 3px;
    transition: opacity 120ms ease;
  }
  .ui-link:hover { opacity: 0.7; }

  .ui-link--muted { color: var(--color-hairline-mid); font-weight: 400; }
  .ui-link--muted:hover { color: var(--color-ink); }

  .ui-link--mute-soft { color: var(--color-mute); font-weight: 400; }
  .ui-link--mute-soft:hover { color: var(--color-body); }

  .ui-link--on-dark { color: var(--color-on-dark); }
  .ui-link--on-dark:hover { opacity: 0.8; }

  .ui-link--blue { color: var(--color-link); font-weight: 400; }

  /* === Field / Input === */
  .ui-field { display: flex; flex-direction: column; gap: 6px; }

  .ui-field__label {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 14px;
    line-height: 16px;
    color: var(--color-ink);
  }
  .ui-field__hint {
    font-family: var(--font-text);
    font-size: 12px;
    line-height: 20px;
    color: var(--color-mute);
  }
  .ui-field__error {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 12px;
    line-height: 16px;
    color: var(--color-toast-error);
  }

  .ui-input-wrapper { position: relative; display: flex; align-items: center; }

  /* Note: selectors are bumped to (0,1,1) so they beat Tailwind preflight's
     `[type="text"], [type="email"], …` reset, which is (0,1,0) and loads
     later in the cascade. Without this, every `.ui-input` rendered as a
     text/date/email/etc. input ends up with `background: white` from
     preflight, breaking the canvas-soft surface across the app. */
  input.ui-input,
  textarea.ui-input,
  select.ui-input {
    width: 100%;
    padding: 16px;
    min-height: 56px;
    border-radius: var(--rounded-md);
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    font-family: var(--font-text);
    font-size: 16px;
    line-height: 24px;
    border: 1px solid transparent;
    outline: none;
    transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
  }
  /* Native <select> chevron + truncation when using .ui-input */
  select.ui-input {
    appearance: none;
    -webkit-appearance: none;
    -moz-appearance: none;
    padding-right: 44px;
    cursor: pointer;
    text-overflow: ellipsis;
    white-space: nowrap;
    overflow: hidden;
    background-image:
      url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 16 16'%3E%3Cpath stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 14px;
  }
  /* Hide IE's native arrow */
  select.ui-input::-ms-expand { display: none; }
  /* --color-body, not --color-mute: #afafaf placeholders land at 1.9:1 on the
     canvas-soft fill, well under the 4.5:1 AA floor. Placeholder text is in
     scope for WCAG 1.4.3. */
  input.ui-input::placeholder,
  textarea.ui-input::placeholder { color: var(--color-body); }
  input.ui-input:hover,
  textarea.ui-input:hover,
  select.ui-input:hover { background-color: var(--color-surface-pressed); }
  input.ui-input:focus,
  textarea.ui-input:focus,
  select.ui-input:focus {
    border-color: var(--color-ink);
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }
  input.ui-input--on-soft,
  textarea.ui-input--on-soft { background-color: var(--color-canvas-softer); }
  input.ui-input--has-icon-right { padding-right: 52px; }
  input.ui-input[aria-invalid="true"],
  textarea.ui-input[aria-invalid="true"],
  select.ui-input[aria-invalid="true"] {
    border-color: var(--color-toast-error);
    box-shadow: 0 0 0 1px var(--color-toast-error) inset;
  }
  input.ui-input:disabled,
  textarea.ui-input:disabled,
  select.ui-input:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  input.ui-input:disabled:hover,
  textarea.ui-input:disabled:hover { background-color: var(--color-canvas-soft); }

  .ui-input-icon-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 0;
    color: var(--color-body);
    cursor: pointer;
    border-radius: var(--rounded-full);
    transition: color 120ms ease, background-color 120ms ease;
  }
  .ui-input-icon-btn:hover { color: var(--color-ink); background-color: var(--color-canvas); }
  .ui-input-icon-btn:focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(0, 0, 0, 0.18); }
  .ui-input-icon-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .ui-input-icon-btn:disabled:hover { color: var(--color-body); background-color: transparent; }

  /* === Select === */
  .ui-select {
    appearance: none;
    -webkit-appearance: none;
    width: 100%;
    padding: 14px 44px 14px 16px;
    min-height: 52px;
    border-radius: var(--rounded-md);
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    font-family: var(--font-text);
    font-size: 16px;
    line-height: 20px;
    border: 1px solid transparent;
    outline: none;
    cursor: pointer;
    background-image:
      url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 16 16'%3E%3Cpath stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 16px;
    transition: background-color 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .ui-select:hover { background-color: var(--color-surface-pressed); }
  .ui-select:focus {
    border-color: var(--color-ink);
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }
  .ui-select--on-soft { background-color: var(--color-canvas-softer); }
  .ui-select[aria-invalid="true"] {
    border-color: var(--color-toast-error);
    box-shadow: 0 0 0 1px var(--color-toast-error) inset;
  }

  /* === Textarea === */
  .ui-textarea {
    width: 100%;
    padding: 16px;
    min-height: 96px;
    border-radius: var(--rounded-md);
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    font-family: var(--font-text);
    font-size: 16px;
    line-height: 24px;
    border: 1px solid transparent;
    outline: none;
    resize: vertical;
    transition: border-color 140ms ease, box-shadow 140ms ease, background-color 140ms ease;
  }
  .ui-textarea::placeholder { color: var(--color-body); }
  .ui-textarea:hover { background-color: var(--color-surface-pressed); }
  .ui-textarea:focus {
    border-color: var(--color-ink);
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }

  /* === Card === */
  .ui-card {
    background-color: var(--color-canvas);
    border-radius: var(--rounded-xl);
    padding: var(--space-2xl);
  }
  .ui-card--soft     { background-color: var(--color-canvas-soft); }
  .ui-card--softer   { background-color: var(--color-canvas-softer); }
  .ui-card--dark     { background-color: var(--color-ink); color: var(--color-on-dark); }
  .ui-card--elevated { box-shadow: var(--shadow-1); }
  .ui-card--lg       { padding: var(--space-3xl); }
  .ui-card--sm       { padding: var(--space-lg); }
  .ui-card--flush    { padding: 0; }

  /* === Badge / Chip === */
  .ui-badge {
    display: inline-flex;
    align-items: center;
    gap: var(--space-xs);
    border-radius: var(--rounded-pill);
    padding: 8px 16px;
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 14px;
    line-height: 16px;
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
  }
  .ui-badge--dark    { background-color: var(--color-ink); color: var(--color-on-dark); }
  .ui-badge--outline { background-color: transparent; border: 1px solid var(--color-ink); }

  /* === Wordmark === */
  .ui-wordmark {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--color-ink);
    text-decoration: none;
  }
  .ui-wordmark__mark { display: inline-flex; align-items: center; justify-content: center; }
  .ui-wordmark__name {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.5px;
    color: var(--color-ink);
  }

  /* === Layout helpers === */
  .ui-stack       { display: flex; flex-direction: column; }
  .ui-stack--xxs  { gap: var(--space-xxs); }
  .ui-stack--xs   { gap: var(--space-xs); }
  .ui-stack--sm   { gap: var(--space-sm); }
  .ui-stack--md   { gap: var(--space-md); }
  .ui-stack--lg   { gap: var(--space-lg); }
  .ui-stack--xl   { gap: var(--space-xl); }
  .ui-stack--2xl  { gap: var(--space-2xl); }
  .ui-stack--3xl  { gap: var(--space-3xl); }

  .ui-row             { display: flex; align-items: center; }
  .ui-row--between    { justify-content: space-between; }
  .ui-row--end        { justify-content: flex-end; }

  .ui-text-muted   { color: var(--color-body); }
  /* `--color-mute` (#afafaf) is a *decorative* token — as text it lands at
     1.9:1 on canvas-soft, well under the 4.5:1 AA floor. Both text utilities
     therefore resolve to --color-body; keep --color-mute for separators,
     dividers and icon chrome only. */
  .ui-text-mute    { color: var(--color-body); }
  /* Available to assistive tech, invisible on screen. For labelling a control
     whose purpose is already obvious from an adjacent visible heading. */
  .ui-visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .ui-text-center  { text-align: center; }
  .ui-text-right   { text-align: right; }
  .ui-text-truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* === Page layout helpers === */
  .page {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: var(--space-2xl);
  }
  .page__header {
    display: flex;
    flex-direction: column;
    gap: var(--space-md);
  }
  .page__header-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-lg);
    flex-wrap: wrap;
  }
  .page__title { margin: 0; }
  .page__subtitle { color: var(--color-body); margin: 0; }
  .page__actions {
    display: flex;
    align-items: center;
    gap: var(--space-sm);
    flex-wrap: wrap;
  }

  /* === Breadcrumb === */
  .ui-breadcrumb {
    display: inline-flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 4px 6px;
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 20px;
  }
  .ui-breadcrumb__item {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-body);
    text-decoration: none;
    transition: color 120ms ease;
  }
  .ui-breadcrumb__item:hover { color: var(--color-ink); }
  .ui-breadcrumb__item--current { color: var(--color-ink); font-weight: 500; cursor: default; }
  .ui-breadcrumb__sep { color: var(--color-mute); }

  /* === Table === */
  .ui-table-wrap {
    background-color: var(--color-canvas);
    border-radius: var(--rounded-xl);
    overflow: hidden;
    overflow-x: auto;
    border: 1px solid var(--color-canvas-soft);
  }
  .ui-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-family: var(--font-text);
    color: var(--color-ink);
    background-color: var(--color-canvas);
  }
  .ui-table thead th {
    background-color: var(--color-canvas-soft);
    text-align: left;
    font-weight: 500;
    font-size: 13px;
    line-height: 16px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--color-body);
    padding: 14px 16px;
    border-bottom: 1px solid var(--color-canvas-soft);
    white-space: nowrap;
  }
  .ui-table tbody td {
    padding: 14px 16px;
    font-size: 14px;
    line-height: 20px;
    border-bottom: 1px solid var(--color-canvas-soft);
    vertical-align: middle;
  }
  .ui-table tbody tr:last-child td { border-bottom: 0; }
  .ui-table tbody tr {
    transition: background-color 120ms ease;
  }
  .ui-table tbody tr:hover { background-color: var(--color-canvas-softer); }
  .ui-table--hover-link tbody tr { cursor: pointer; }
  .ui-table__empty {
    padding: 48px 24px;
    text-align: center;
    color: var(--color-body);
  }

  /* === Tabs === */
  .ui-tabs {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    background-color: var(--color-canvas-soft);
    border-radius: var(--rounded-pill-tab);
    flex-wrap: wrap;
  }
  .ui-tab {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border-radius: var(--rounded-pill);
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 14px;
    line-height: 16px;
    color: var(--color-body);
    background: transparent;
    border: 0;
    cursor: pointer;
    text-decoration: none;
    transition: background-color 140ms ease, color 140ms ease;
    white-space: nowrap;
  }
  .ui-tab:hover { color: var(--color-ink); }
  .ui-tab--active { background-color: var(--color-canvas); color: var(--color-ink); box-shadow: var(--shadow-3); }

  /* === Status pill semantic accents — limited palette === */
  .ui-status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 12px;
    border-radius: var(--rounded-pill);
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 13px;
    line-height: 16px;
    white-space: nowrap;
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
  }
  .ui-status::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background-color: var(--color-mute);
  }
  .ui-status--neutral::before { background-color: var(--color-body); }
  .ui-status--success { background-color: #e9f7ee; color: #155724; }
  .ui-status--success::before { background-color: var(--color-toast-success); }
  .ui-status--error { background-color: #fde9e9; color: #842029; }
  .ui-status--error::before { background-color: var(--color-toast-error); }
  .ui-status--warning { background-color: #fcf3da; color: #735200; }
  .ui-status--warning::before { background-color: var(--color-toast-warning); }
  .ui-status--info { background-color: #e7f0fd; color: #1c4ea8; }
  .ui-status--info::before { background-color: var(--color-toast-info); }
  .ui-status--dark { background-color: var(--color-ink); color: var(--color-on-dark); }
  .ui-status--dark::before { background-color: var(--color-on-dark); }

  /* === Empty state === */
  .ui-empty {
    background-color: var(--color-canvas-soft);
    border-radius: var(--rounded-xl);
    padding: 48px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .ui-empty__icon {
    width: 48px;
    height: 48px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--rounded-full);
    background-color: var(--color-canvas);
    color: var(--color-body);
  }

  /* === Toolbar / filter row === */
  .ui-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--space-md);
  }
  .ui-toolbar__spacer { flex: 1; }

  /* === Compact filter pattern (shared across list pages) === */
  .filter-row {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--space-md) var(--space-lg);
  }
  .filter-row__actions {
    display: flex;
    justify-content: flex-end;
    padding-top: 4px;
  }
  .filter-field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1 1 160px;
    min-width: 130px;
    max-width: 220px;
  }
  .filter-field__label {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 11px;
    line-height: 14px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--color-body);
  }
  /* Note: like .ui-input, the selectors below are bumped to (0,1,1) so they
     beat Tailwind preflight's `[type="text"], [type="date"], select, …` reset
     (0,1,0), which would otherwise paint white over the canvas-soft surface. */
  input.filter-field__control,
  select.filter-field__control,
  textarea.filter-field__control {
    width: 100%;
    height: 36px;
    padding: 0 12px;
    border-radius: var(--rounded-md);
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 16px;
    border: 1px solid transparent;
    outline: none;
    transition: background-color 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  input.filter-field__control:hover,
  select.filter-field__control:hover,
  textarea.filter-field__control:hover { background-color: var(--color-surface-pressed); }
  input.filter-field__control:focus,
  select.filter-field__control:focus,
  textarea.filter-field__control:focus {
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }
  select.filter-field__control {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 32px;
    cursor: pointer;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' viewBox='0 0 16 16'%3E%3Cpath stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 10px center;
    background-size: 14px;
  }
  input[type="date"].filter-field__control { padding-right: 8px; }

  /* === Grid helpers === */
  .ui-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-md); }
  .ui-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-md); }
  @media (max-width: 720px) { .ui-grid-2, .ui-grid-3 { grid-template-columns: 1fr; } }

  /* === Generic form styling — applies to any Django-rendered form field inside .ui-form === */
  .ui-form input[type="text"]:not(.ui-input):not(.file-drop-zone__input),
  .ui-form input[type="email"]:not(.ui-input),
  .ui-form input[type="number"]:not(.ui-input),
  .ui-form input[type="date"]:not(.ui-input),
  .ui-form input[type="url"]:not(.ui-input),
  .ui-form input[type="tel"]:not(.ui-input),
  .ui-form input[type="password"]:not(.ui-input),
  .ui-form input[type="search"]:not(.ui-input),
  .ui-form select:not(.ui-select),
  .ui-form textarea:not(.ui-textarea) {
    width: 100%;
    padding: 14px 16px;
    min-height: 52px;
    border-radius: var(--rounded-md);
    background-color: var(--color-canvas-soft);
    color: var(--color-ink);
    font-family: var(--font-text);
    font-size: 16px;
    line-height: 20px;
    border: 1px solid transparent;
    outline: none;
    transition: background-color 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
  }
  .ui-form select:not(.ui-select) {
    appearance: none;
    -webkit-appearance: none;
    padding-right: 44px;
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='16' height='16' fill='none' viewBox='0 0 16 16'%3E%3Cpath stroke='%23000' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.6' d='m4 6 4 4 4-4'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 16px;
    cursor: pointer;
  }
  .ui-form textarea:not(.ui-textarea) { min-height: 120px; resize: vertical; padding: 16px; }
  .ui-form input:not(.ui-input):not(.file-drop-zone__input):hover,
  .ui-form select:not(.ui-select):hover,
  .ui-form textarea:not(.ui-textarea):hover { background-color: var(--color-surface-pressed); }
  .ui-form input:not(.ui-input):not(.file-drop-zone__input):focus,
  .ui-form select:not(.ui-select):focus,
  .ui-form textarea:not(.ui-textarea):focus {
    border-color: var(--color-ink);
    background-color: var(--color-canvas);
    box-shadow: 0 0 0 1px var(--color-ink) inset;
  }
  .ui-form input[type="checkbox"],
  .ui-form input[type="radio"] {
    width: 18px;
    height: 18px;
    accent-color: var(--color-ink);
  }
  .ui-form .errorlist { list-style: none; padding: 0; margin: 4px 0 0; color: var(--color-toast-error); font-size: 12px; }

  /* File drop zone (used by upload pages) */
  .file-drop-zone {
    position: relative;
    border: 2px dashed var(--color-canvas-soft);
    border-radius: var(--rounded-xl);
    padding: 32px 24px;
    text-align: center;
    background-color: var(--color-canvas-softer);
    transition: border-color 140ms ease, background-color 140ms ease;
    cursor: pointer;
  }
  .file-drop-zone:hover { border-color: var(--color-ink); background-color: var(--color-canvas-soft); }
  .file-drop-zone--active { border-color: var(--color-ink); background-color: var(--color-canvas-soft); }
  .file-drop-zone__input { display: none; }
  .file-drop-zone__icon { width: 40px; height: 40px; color: var(--color-body); }
  .file-drop-zone__content,
  .file-drop-zone__preview { display: flex; flex-direction: column; align-items: center; }
  .file-drop-zone__preview.hidden,
  .file-drop-zone__content.hidden { display: none; }

  /* Global `.hidden` utility — matches Tailwind/Flowbite expectations.
     Anything with this class is hidden, regardless of its base display value. */
  .hidden { display: none !important; }

  /* === Definition list (key/value rows) === */
  .ui-dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 12px 24px;
    margin: 0;
  }
  .ui-dl dt {
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 13px;
    line-height: 20px;
    color: var(--color-body);
    text-transform: uppercase;
    letter-spacing: 0.4px;
  }
  .ui-dl dd {
    margin: 0;
    font-family: var(--font-text);
    font-size: 14px;
    line-height: 20px;
    color: var(--color-ink);
  }
  @media (max-width: 600px) {
    .ui-dl { grid-template-columns: 1fr; gap: 4px; }
    .ui-dl dd { margin-bottom: 8px; }
  }

  /* === Toast ===
     Per-variant accent colors are exposed as scoped CSS vars so the
     surface, indicator, close button, and progress bar all read from the
     same palette and stay visually coherent. */
  .ui-toast-stack {
    position: fixed;
    z-index: 9999;
    display: flex;
    flex-direction: column;
    gap: 10px;
    pointer-events: none;
    padding: 0 16px;
  }
  .ui-toast-stack--bottom-center { bottom: 24px; left: 50%; transform: translateX(-50%); align-items: center; }
  .ui-toast-stack--top-center    { top: 24px;    left: 50%; transform: translateX(-50%); align-items: center; flex-direction: column-reverse; }
  .ui-toast-stack--bottom-right  { bottom: 24px; right: 24px; align-items: flex-end; }
  .ui-toast-stack--bottom-left   { bottom: 24px; left:  24px; align-items: flex-start; }
  .ui-toast-stack--top-right     { top: 24px;    right: 24px; align-items: flex-end;     flex-direction: column-reverse; }
  .ui-toast-stack--top-left      { top: 24px;    left:  24px; align-items: flex-start;   flex-direction: column-reverse; }

  .ui-toast {
    --toast-bg:      var(--color-ink);
    --toast-fg:      var(--color-on-dark);
    --toast-accent:  var(--color-on-dark);
    --toast-border:  transparent;
    --toast-close:   rgba(255, 255, 255, 0.7);
    --toast-close-hover-bg: rgba(255, 255, 255, 0.12);
    --toast-progress-track: rgba(255, 255, 255, 0.18);
    --toast-duration: 3000ms;

    pointer-events: auto;
    position: relative;
    overflow: hidden;
    background-color: var(--toast-bg);
    color: var(--toast-fg);
    padding: 12px 12px 14px 16px;
    border-radius: var(--rounded-xl);
    border: 1px solid var(--toast-border);
    display: inline-flex;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow-2);
    min-width: 280px;
    max-width: min(520px, calc(100vw - 32px));
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 14px;
    line-height: 20px;
    animation: ui-toast-in 220ms cubic-bezier(0.2, 0.7, 0.2, 1);
  }

  /* Variant palettes — tinted bg + matching accent. */
  .ui-toast--success {
    --toast-bg:     #e9f7ee;
    --toast-fg:     #155724;
    --toast-accent: var(--color-toast-success);
    --toast-border: #cbe9d4;
    --toast-close:  rgba(21, 87, 36, 0.55);
    --toast-close-hover-bg: rgba(31, 138, 59, 0.14);
    --toast-progress-track: rgba(31, 138, 59, 0.18);
  }
  .ui-toast--error {
    --toast-bg:     #fde9e9;
    --toast-fg:     #842029;
    --toast-accent: var(--color-toast-error);
    --toast-border: #f5c5c5;
    --toast-close:  rgba(132, 32, 41, 0.55);
    --toast-close-hover-bg: rgba(217, 33, 33, 0.14);
    --toast-progress-track: rgba(217, 33, 33, 0.18);
  }
  .ui-toast--warning {
    --toast-bg:     #fcf3da;
    --toast-fg:     #735200;
    --toast-accent: var(--color-toast-warning);
    --toast-border: #f1dfaa;
    --toast-close:  rgba(115, 82, 0, 0.55);
    --toast-close-hover-bg: rgba(201, 138, 0, 0.14);
    --toast-progress-track: rgba(201, 138, 0, 0.20);
  }
  .ui-toast--info {
    --toast-bg:     #e7f0fd;
    --toast-fg:     #1c4ea8;
    --toast-accent: var(--color-toast-info);
    --toast-border: #c6dafa;
    --toast-close:  rgba(28, 78, 168, 0.55);
    --toast-close-hover-bg: rgba(42, 110, 245, 0.14);
    --toast-progress-track: rgba(42, 110, 245, 0.18);
  }

  @keyframes ui-toast-in {
    from { opacity: 0; transform: translateY(12px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  .ui-toast--leaving { animation: ui-toast-out 180ms ease-in forwards; }
  @keyframes ui-toast-out {
    to { opacity: 0; transform: translateY(8px) scale(0.98); }
  }

  .ui-toast__indicator {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background-color: var(--toast-accent);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--toast-accent) 22%, transparent);
    flex-shrink: 0;
  }

  .ui-toast__message { flex: 1; white-space: normal; }

  .ui-toast__close {
    background: transparent;
    border: 0;
    color: var(--toast-close);
    cursor: pointer;
    padding: 4px;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: var(--rounded-full);
    transition: color 120ms ease, background-color 120ms ease;
    flex-shrink: 0;
  }
  .ui-toast__close:hover {
    color: var(--toast-fg);
    background-color: var(--toast-close-hover-bg);
  }
  .ui-toast__close:focus-visible {
    outline: none;
    box-shadow: 0 0 0 2px color-mix(in srgb, var(--toast-accent) 40%, transparent);
  }

  /* Progress bar — drains over the toast's duration, pauses with the timer. */
  .ui-toast__progress {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 3px;
    background-color: var(--toast-progress-track);
    overflow: hidden;
  }
  .ui-toast__progress-fill {
    position: absolute;
    inset: 0;
    background-color: var(--toast-accent);
    transform-origin: left center;
    animation-name: ui-toast-progress;
    animation-duration: var(--toast-duration);
    animation-timing-function: linear;
    animation-fill-mode: forwards;
    animation-play-state: running;
  }
  .ui-toast--paused .ui-toast__progress-fill { animation-play-state: paused; }
  @keyframes ui-toast-progress {
    from { transform: scaleX(1); }
    to   { transform: scaleX(0); }
  }

  /* === Modal (works with Flowbite data-modal-* attributes) ============= */
  .ui-modal__backdrop {
    position: fixed; inset: 0; z-index: 50;
    background-color: rgba(15, 18, 24, 0.55);
    display: flex; align-items: center; justify-content: center;
    padding: 16px; overflow-y: auto;
  }
  .ui-modal__panel {
    background-color: var(--color-canvas);
    border-radius: var(--rounded-xl);
    width: 100%; max-width: 560px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.18);
    overflow: hidden;
    display: flex; flex-direction: column;
    max-height: calc(100vh - 32px);
  }
  .ui-modal__panel--lg { max-width: 720px; }
  .ui-modal__panel--xl { max-width: 920px; }
  .ui-modal__header {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    padding: var(--space-lg);
    border-bottom: 1px solid var(--color-canvas-soft);
  }
  .ui-modal__header--dark {
    background-color: var(--color-ink);
    color: var(--color-on-dark);
    border-bottom: 1px solid var(--color-ink);
  }
  .ui-modal__close {
    appearance: none; border: 0;
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--rounded-pill);
    background-color: var(--color-canvas-soft);
    color: var(--color-body);
    cursor: pointer;
    transition: background-color 150ms ease, color 150ms ease;
  }
  .ui-modal__close:hover {
    background-color: var(--color-canvas-softer);
    color: var(--color-ink);
  }
  .ui-modal__header--dark .ui-modal__close {
    background-color: rgba(255, 255, 255, 0.10);
    color: var(--color-on-dark);
  }
  .ui-modal__header--dark .ui-modal__close:hover {
    background-color: rgba(255, 255, 255, 0.18);
    color: var(--color-on-dark);
  }
  .ui-modal__body {
    padding: var(--space-lg);
    overflow-y: auto;
  }
  .ui-modal__footer {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 8px;
    padding: var(--space-md) var(--space-lg);
    border-top: 1px solid var(--color-canvas-soft);
    background-color: var(--color-canvas-softer);
  }

  /* === Table — clean rows, ink head, hover ============================= */
  .ui-table-shell {
    background-color: var(--color-canvas);
    border-radius: var(--rounded-xl);
    overflow: hidden;
    border: 1px solid var(--color-canvas-soft);
  }
  .ui-table-scroll {
    overflow-x: auto;
  }
  .ui-table {
    width: 100%;
    border-collapse: collapse;
    text-align: left;
    font-family: var(--font-text);
    font-size: 14px;
    color: var(--color-ink);
  }
  /* Auto-layout variant: column widths follow content (use min/max-width in cells
     to constrain truncation) rather than declared percentages. Ensures the
     actions column never gets squeezed off-screen. */
  .ui-table--auto { table-layout: auto; }
  .ui-table thead {
    background-color: var(--color-canvas-soft);
  }
  .ui-table thead th {
    padding: 12px 16px;
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 11px;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: var(--color-body);
    border-bottom: 1px solid var(--color-canvas-soft);
  }
  .ui-table tbody tr {
    background-color: var(--color-canvas);
    border-bottom: 1px solid var(--color-canvas-soft);
    transition: background-color 120ms ease;
  }
  .ui-table tbody tr:hover {
    background-color: var(--color-canvas-softer);
  }
  .ui-table tbody tr:last-child { border-bottom: 0; }
  .ui-table__cell,
  .ui-table__cell--head {
    padding: 14px 16px;
    vertical-align: top;
  }
  .ui-table__cell--head {
    font-family: var(--font-text);
    font-weight: 500;
    color: var(--color-ink);
  }
  .ui-table__cell--actions {
    text-align: right;
    white-space: nowrap;
  }
  .ui-table__col--actions {
    width: 1px;            /* shrink-to-fit: column matches its content */
    white-space: nowrap;
  }
  .ui-table__foot th {
    padding: 14px 16px;
    background-color: var(--color-canvas-soft);
    border-top: 1px solid var(--color-canvas-soft);
  }

  /* === Small action chip (inline pill button for table cells) ========== */
  .ui-chip {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 4px 10px;
    border-radius: var(--rounded-pill);
    font-family: var(--font-text);
    font-weight: 500;
    font-size: 11px;
    border: 1px solid transparent;
    background-color: var(--color-canvas-soft);
    color: var(--color-body);
    text-decoration: none;
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease, border-color 120ms ease;
    width: fit-content;
  }
  .ui-chip:hover { background-color: var(--color-canvas-softer); color: var(--color-ink); }
  .ui-chip--action { background-color: var(--color-canvas-soft); color: var(--color-body); }
  .ui-chip--action:hover { background-color: var(--color-canvas-softer); color: var(--color-ink); }
  .ui-chip--danger { background-color: rgba(217, 33, 33, 0.08); color: var(--color-toast-error); }
  .ui-chip--danger:hover { background-color: rgba(217, 33, 33, 0.14); color: var(--color-toast-error); }
  .ui-chip--warning { background-color: rgba(201, 138, 0, 0.10); color: var(--color-toast-warning); }
  .ui-chip--warning:hover { background-color: rgba(201, 138, 0, 0.18); color: var(--color-toast-warning); }

  /* === Icon-only round button (table row actions) ====================== */
  .ui-icon-btn {
    appearance: none; border: 0;
    width: 32px; height: 32px;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--rounded-pill);
    background-color: var(--color-canvas-soft);
    color: var(--color-body);
    cursor: pointer;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .ui-icon-btn:hover { background-color: var(--color-canvas-softer); color: var(--color-ink); }
  .ui-icon-btn--danger { color: var(--color-toast-error); }
  .ui-icon-btn--danger:hover { background-color: rgba(217, 33, 33, 0.10); color: var(--color-toast-error); }

  /* === Paginator (shared across list/detail pages) ===================== */
  .paginator { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 0; flex-wrap: wrap; }
  .paginator__summary { margin: 0; }
  .paginator__summary-strong { color: var(--color-ink); font-weight: 600; }
  .paginator__pages { display: inline-flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .paginator__btn, .paginator__page {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 36px; height: 36px; padding: 0 12px;
    border-radius: var(--rounded-pill);
    background-color: var(--color-canvas); color: var(--color-ink);
    border: 1px solid var(--color-canvas-soft);
