<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SITTS — Portal da Transparência {% block title %}{% endblock %}</title>
  <link rel="shortcut icon" type="image/png" href="https://storage.googleapis.com/sitts-project-media-bucket/logos/blue-favicon-32x32.png">
  {% include 'ui/_styles.html' %}
  <style>
    body { background-color: var(--color-canvas-softer); min-height: 100vh; display: flex; flex-direction: column; }
    .portal-nav {
      background-color: var(--color-ink); color: var(--color-on-dark);
      padding: 16px 24px;
    }
    .portal-nav__inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
    }
    .portal-nav__brand {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--color-on-dark); text-decoration: none;
      font-family: var(--font-display); font-weight: 700; font-size: 18px;
    }
    .portal-nav__links { display: flex; align-items: center; gap: 16px; }
    .portal-nav__link {
      color: var(--color-on-dark); text-decoration: none;
      padding: 8px 14px; border-radius: var(--rounded-pill);
      font-family: var(--font-text); font-weight: 500; font-size: 14px;
      transition: background-color 140ms ease;
    }
    .portal-nav__link:hover { background-color: var(--color-black-elevated); }

    .portal-main { flex: 1; padding: 32px 16px 48px; }
    .portal-main__inner { max-width: 1200px; margin: 0 auto; }

    .portal-footer {
      background-color: var(--color-ink); color: var(--color-on-dark);
      padding: 24px 16px;
    }
    .portal-footer__inner {
      max-width: 1200px; margin: 0 auto;
      display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
    }
    .portal-footer__about { display: flex; flex-direction: column; gap: 4px; }
    .portal-footer__about-title { font-family: var(--font-display); font-weight: 700; font-size: 16px; }
    .portal-footer__copy { color: var(--color-mute); font-size: 14px; }
  </style>
</head>
<body>
  <nav class="portal-nav">
    <div class="portal-nav__inner">
      <a class="portal-nav__brand" href="{% url 'transparency:partnership_list' %}">
        <svg width="24" height="24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
        SITTS · Portal da Transparência
      </a>
      <div class="portal-nav__links">
        <a class="portal-nav__link" href="{% url 'transparency:partnership_list' %}">Parcerias</a>
      </div>
    </div>
  </nav>

  <main class="portal-main">
    <div class="portal-main__inner">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="portal-footer">
    <div class="portal-footer__inner">
      <div class="portal-footer__about">
        <p class="portal-footer__about-title">Portal da Transparência</p>
        <p class="portal-footer__copy">Informações sobre parcerias com organizações do terceiro setor.</p>
      </div>
      <p class="portal-footer__copy">© {% now "Y" %} Todos os direitos reservados.</p>
    </div>
  </footer>
</body>
</html>
