name: Production

on:
  workflow_dispatch:

env:
  DOCKER_REGISTRY: southamerica-east1-docker.pkg.dev
  DOCKER_REPO: sitts-project/cloud-run-source-deploy
  REGION: southamerica-east1
  SERVICE: sitts
  PROJECT_ID: sitts-project
  ENV: production

jobs:
  production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: "write"
      id-token: "write"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Google auth
        id: auth
        uses: "google-github-actions/auth@v2"
        with:
          export_environment_variables: true
          project_id: "${{ env.PROJECT_ID}}"
          token_format: "access_token"
          workload_identity_provider: "projects/455340212401/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "github-deploy@sitts-project.iam.gserviceaccount.com"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v2"
        with:
          version: ">= 452.0.0"

      - name: Build and Push Docker Image
        id: docker_build
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          IMAGE_NAME="${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.SERVICE }}:$TIMESTAMP"
      
          gcloud auth configure-docker ${{ env.DOCKER_REGISTRY }} --quiet
      
          docker build -f dockerfile -t $IMAGE_NAME .
          docker push $IMAGE_NAME
      
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Pre-deploy (migrate and collectstatic)
        run: |
          gcloud run jobs update ${{ env.SERVICE }}-pre-deploy \
          --labels ^,^application=${{ env.SERVICE }},component=pre-deploy \
          --set-env-vars="ENV=production,GOOGLE_CLOUD_PROJECT=sitts-project" \
          --set-secrets=DJANGO_SETTINGS=django_settings:latest \
          --region=${{ env.REGION }} \
          --image=${{ env.IMAGE_NAME }} \
          --cpu=1 \
          --memory=512Mi \
          --max-retries=1 \
          --task-timeout=600 \
          --command="sh" \
          --args="-c" \
          --args="set -o allexport; source /secrets/DJANGO_SETTINGS; set +o allexport; python manage.py migrate && python manage.py collectstatic --noinput" \
          --execute-now \
          --wait

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          project_id: ${{ env.PROJECT_ID }}
          image: ${{ steps.docker_build.outputs.IMAGE_NAME }}
          revision_traffic: 'LATEST=100'
          # Pinned so a console edit can never silently reintroduce
          # always-on billing. min-instances=0 keeps scale-to-zero;
          # cpu-throttling bills CPU only while a request is in flight;
          # max-instances caps the blast radius of a traffic spike.
          #
          # memory=512Mi: measured peak RSS rendering every report against a
          # contract with 20k expenses + 20k revenues is ~342 MiB (see
          # docs/DEPLOY.md). 256Mi and 384Mi are both under that; 512Mi is the
          # smallest tier that fits, with ~170 MiB to spare.
          #
          # cpu=1 is not padding — below 1 vCPU Cloud Run forces
          # max-concurrency to 1, so every simultaneous request would need its
          # own instance. With max-instances=2 that caps the whole service at
          # two in-flight requests, and under request-based billing it costs
          # more than one shared instance, not less.
          #
          # gen1 boots faster than gen2 and allows sub-512Mi if the footprint
          # ever shrinks; gen2 buys nothing here and has a 512Mi floor. With
          # min-instances=0 nearly every request pays a cold start, so startup
          # latency is the thing to optimise.
          #
          # concurrency=8 against the 4 gunicorn threads in the dockerfile:
          # mild queueing is cheaper than a second instance at this traffic.
          # timeout=300 bounds how long a wedged request can bill.
          flags: >-
            --min-instances=0
            --max-instances=2
            --cpu-throttling
            --cpu=1
            --memory=512Mi
            --execution-environment=gen1
            --concurrency=8
            --timeout=300

      - name: Tag production docker image
        run: |
          gcloud artifacts docker tags add \
            ${{ steps.docker_build.outputs.IMAGE_NAME }} \
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.SERVICE }}:production

          gcloud artifacts docker tags add \
            ${{ steps.docker_build.outputs.IMAGE_NAME }} \
            ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPO }}/${{ env.SERVICE }}:latest

  update_release:
    name: Update release
    needs: production
    runs-on: ubuntu-latest
    permissions:
      contents: "write"
      id-token: "write"
    steps:
      - name: Create github release
        uses: actions/github-script@v7
        with:
          script: |
            const timestamp = new Date().toISOString().replace(/[-:.TZ]/g, "").slice(0, 14);
            const tagName = `release-${timestamp}`;

            const latestRelease = await github.rest.repos.getLatestRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
            }).catch(() => null);

            const previousTag = latestRelease ? latestRelease.data.tag_name : null;

            const releaseNotes = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              previous_tag_name: previousTag,
            });

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tagName,
              name: `Release ${timestamp}`,
              body: releaseNotes.data.body,
              prerelease: false,
            });
